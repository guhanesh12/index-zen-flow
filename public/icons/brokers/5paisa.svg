<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="red-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EE2B2B" />
      <stop offset="100%" stop-color="#BF1D1D" />
    </linearGradient>
    <linearGradient id="silver-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="metal-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Red Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#red-base)" />
  <!-- Silver Metallic Plate -->
  <path d="M 12 24 C 12 17 17 12 24 12 L 56 12 C 72 12 78 28 72 50 C 66 72 54 88 36 88 L 24 88 C 17 88 12 83 12 76 Z" fill="url(#silver-plate)" filter="url(#metal-shadow)" />
  <!-- Embossed 3D '5' -->
  <text x="40" y="69" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="54" fill="#334155" filter="url(#metal-shadow)">5</text>
  <text x="39" y="68" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="54" fill="#E2E8F0">5</text>
</svg>
